# fly.toml app configuration file generated for outfit-selector-ai on 2026-09-27T19:28:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'outfit-selector-ai'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
